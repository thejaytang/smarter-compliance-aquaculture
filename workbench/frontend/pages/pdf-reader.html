<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saved original PDF</title>
<link rel="stylesheet" href="/vendor/pdfjs/web/pdf_viewer.css">
<link rel="stylesheet" href="/pdf-reader.css">
</head><body>
<header aria-label="PDF reading controls">
  <div id="source" aria-label="Saved source file">Saved original PDF</div>
  <div class="controls"><button id="previous" aria-label="Previous page" disabled>←</button><label>Page <input id="page" aria-describedby="page-error" type="number" min="1" value="1" disabled></label><span id="pages">of …</span><button id="next" aria-label="Next page" disabled>→</button>
  <span id="page-error" role="alert" hidden></span><label>Zoom <select id="zoom" disabled><option value="page-width">Fit width</option><option value="page-fit">Fit page</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><button id="rotate" disabled>Rotate</button></div>
  <form id="search" class="controls" role="search"><input id="query" type="search" aria-label="Find in original PDF" placeholder="Find in original" disabled><button id="find" disabled>Find</button><button id="find-previous" type="button" disabled>Previous match</button><button id="find-next" type="button" disabled>Next match</button><span id="matches" role="status"></span></form>
</header>
<main><div id="viewerContainer" tabindex="0" aria-label="Saved PDF pages; select text to copy"><div id="viewer" class="pdfViewer"></div></div></main>
<footer><span id="status" role="status">Opening saved original…</span><button id="retry" hidden>Retry</button><a id="original" hidden target="_blank" rel="noopener">Open original</a><a id="workbench" href="/">Workbench</a></footer>
<script type="module" src="/pdf-reader.js"></script>
</body></html>
