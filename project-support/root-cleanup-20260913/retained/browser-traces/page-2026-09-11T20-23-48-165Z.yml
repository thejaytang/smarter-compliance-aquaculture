                          - generic [ref=f18e226]:
                            - heading "Kort om loven" [level=2] [ref=f18e227]
                            - generic [ref=f18e228]:
                              - paragraph [ref=f18e229]: Sist endret 22.03.2024
                              - paragraph [ref=f18e230]: Akvakulturloven er en norsk lov som regulerer produksjonen av vannlevende dyr og planter, også kalt akvakultur. Loven gir vilkår for å få tillatelse til å bedrive akvakultur og fastslår at dette skal drives på en miljømessig forsvarlig måte. Nærings- og fiskeridepartementet kan ifølge loven gi nærmere regler for å sikre at miljøet blir ivaretatt. Lovens formål er å fremme akvakulturnæringens lønnsomhet samtidig som man sikrer en bærekraftig utvikling.
                              - paragraph [ref=f18e231]: Bakgrunnen for loven var at akvakulturnæringen på slutten av 1900-tallet endret seg. Mens akvakultur tidligere hovedsaklig handlet om fiskeoppdrett, som var regulert i den daværende fiskeoppdrettsloven, gjorde utviklingen av andre ulike produksjonstyper at man nå trengte en lovgivning som regulerte alle former for akvakultur. I tillegg ønsket man å i større grad ta hensyn til miljøet. Det var derfor behov for en ny, mer omfattende og miljøorientert lov som kunne erstatte fiskeoppdrettsloven, og resultatet ble akvakulturloven.
                              - paragraph [ref=f18e232]: Les mer i Store norske leksikon.
                          - separator [ref=f18e233]
                          - generic [ref=f18e234]:
                            - text: "Kapitteloversikt:"
                            - list [ref=f18e235]:
                              - listitem [ref=f18e236]: Kapittel I. Formål og virkeområde (§§ 1 - 3)
                              - listitem [ref=f18e237]: Kapittel II. Akvakulturtillatelse (§§ 4 - 9)
                              - listitem [ref=f18e238]: Kapittel III. Miljøhensyn (§§ 10 - 14)
                              - listitem [ref=f18e239]: Kapittel IV. Arealutnyttelse (§§ 15 - 17)
                              - listitem [ref=f18e240]: Kapittel V. Registrering, overføring og pantsettelse av akvakulturtillatelse (§§ 18 - 20)
                              - listitem [ref=f18e241]: Kapittel VI. Generelle krav og forpliktelser (§§ 21 - 26)
                              - listitem [ref=f18e242]: Kapittel VII. Reaksjoner og sanksjoner ved overtredelse (§§ 27 - 31 a)
                              - listitem [ref=f18e243]: Kapittel VIII. Avsluttende bestemmelser (§§ 32 - 36)
                          - separator [ref=f18e244]
                          - generic [ref=f18e245]:
                            - generic [ref=f18e246]:
                              - heading "Kapittel I. Formål og virkeområde" [level=2] [ref=f18e247]
                              - generic [ref=f18e248]:
                                - heading [level=3] [ref=f18e249]:
                                  - generic [ref=f18e250]:
                                    - text: § 1.
                                    - emphasis [ref=f18e252]: Formål
                                - paragraph [ref=f18e253]: Loven skal fremme akvakulturnæringens lønnsomhet og konkurransekraft innenfor rammene av en bærekraftig utvikling, og bidra til verdiskaping på kysten.
                                - generic [ref=f18e254]: 🔗Del paragraf
                              - generic [ref=f18e255]:
                                - heading [level=3] [ref=f18e256]:
                                  - generic [ref=f18e257]:
                                    - text: § 2.
                                    - emphasis [ref=f18e259]: Saklig virkeområde
                                - paragraph [ref=f18e260]: Loven gjelder produksjon av akvatiske organismer (akvakultur). Med akvatiske organismer forstås vannlevende dyr og planter. Som produksjon regnes ethvert tiltak for å påvirke levende akvatiske organismers vekt, størrelse, antall, egenskaper eller kvalitet. I tvilstilfeller kan departementet i enkeltvedtak eller forskrift bestemme hva som anses som akvakultur.
                                - paragraph [ref=f18e261]: Loven gjelder også anlegg ment for akvakultur, herunder anlegg uten akvatiske organismer.
                                - paragraph [ref=f18e262]: Lovens § 12 og kapittel VI til VIII gjelder også for vare- og tjenesteproduksjon til akvakulturnæringen.
                                - paragraph [ref=f18e263]: Departementet kan i forskrift bestemme at aktiviteter som nevnt i første til tredje ledd ikke skal omfattes av hele eller deler av loven.
                                - paragraph [ref=f18e264]: Produksjon av anadrome laksefisk og innlandsfisk til kultiveringsformål reguleres av lov 15. mai 1992 nr. 47 om laksefisk og innlandsfisk m.v.
                                - table [ref=f18e265]:
                                  - rowgroup [ref=f18e266]:
                                    - row [ref=f18e267]:
                                      - cell "0" [ref=f18e268]
                                      - cell "Endret ved lov 21 juni 2013 nr. 74 (ikr. 1 juli 2013 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e269]
                                - generic [ref=f18e270]: 🔗Del paragraf
                              - generic [ref=f18e271]:
                                - heading [level=3] [ref=f18e272]:
                                  - generic [ref=f18e273]:
                                    - text: § 3.
                                    - emphasis [ref=f18e275]: Geografisk virkeområde
                                - paragraph [ref=f18e276]: "Denne loven gjelder:"
                                - table [ref=f18e277]:
                                  - rowgroup [ref=f18e278]:
                                    - row [ref=f18e279]:
                                      - cell "a." [ref=f18e280]
                                      - cell "på landterritoriet og i territorialfarvannet," [ref=f18e281]
                                - table [ref=f18e282]:
                                  - rowgroup [ref=f18e283]:
                                    - row [ref=f18e284]:
                                      - cell "b." [ref=f18e285]
                                      - cell "i jurisdiksjonsområder etablert i medhold av lov 17. desember 1976 nr. 91 om Norges økonomiske sone, og" [ref=f18e286]
                                - table [ref=f18e287]:
                                  - rowgroup [ref=f18e288]:
                                    - row [ref=f18e289]:
                                      - cell "c." [ref=f18e290]
                                      - cell "på kontinentalsokkelen." [ref=f18e291]
                                - paragraph [ref=f18e292]: Loven gjelder ikke på Svalbard og Jan Mayen. Kongen kan gi forskrift om at loven helt eller delvis skal gjelde på Svalbard og Jan Mayen og kan fastsette nærmere bestemmelser av hensyn til de stedlige forhold, herunder bestemmelser som fraviker bestemmelser i denne lov.
                                - generic [ref=f18e293]: 🔗Del paragraf
                            - generic [ref=f18e294]:
                              - heading "Kapittel II. Akvakulturtillatelse" [level=2] [ref=f18e295]
                              - generic [ref=f18e296]:
                                - heading [level=3] [ref=f18e297]:
                                  - generic [ref=f18e298]:
                                    - text: § 4.
                                    - emphasis [ref=f18e300]: Krav om akvakulturtillatelse
                                - paragraph [ref=f18e301]: Departementet kan gi tillatelse til å drive akvakultur (akvakulturtillatelse) etter §§ 6 og 7. Slik tillatelse kan også erverves ved overføring etter § 19.
                                - paragraph [ref=f18e302]: Ingen kan drive akvakultur uten å være registrert som innehaver av akvakulturtillatelse i akvakulturregisteret, jf. § 18 første ledd.
                                - generic [ref=f18e303]: 🔗Del paragraf
                              - generic [ref=f18e304]:
                                - heading [level=3] [ref=f18e305]:
                                  - generic [ref=f18e306]:
                                    - text: § 5.
                                    - emphasis [ref=f18e308]: Akvakulturtillatelsens innhold
                                - paragraph [ref=f18e309]: Akvakulturtillatelsen gir rett til produksjon av bestemte arter på avgrensede geografiske områder (lokaliteter), med de til enhver tid fastsatte begrensninger av tillatelsens omfang.
                                - paragraph [ref=f18e310]: Departementet kan i enkeltvedtak eller forskrift gi nærmere bestemmelser om innholdet i akvakulturtillatelser, herunder omfang, avgrensing i tid mv.
                                - generic [ref=f18e311]: 🔗Del paragraf
                              - generic [ref=f18e312]:
                                - heading [level=3] [ref=f18e313]:
                                  - generic [ref=f18e314]:
                                    - text: § 6.
                                    - emphasis [ref=f18e316]: Generelle vilkår for tildeling av akvakulturtillatelse
                                - paragraph [ref=f18e317]: "Departementet kan etter søknad gi tillatelse til akvakultur dersom:"
