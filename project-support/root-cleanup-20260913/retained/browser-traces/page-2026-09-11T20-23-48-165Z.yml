                                - table [ref=f18e323]:
                                  - rowgroup [ref=f18e324]:
                                    - row [ref=f18e325]:
                                      - cell "b." [ref=f18e326]
                                      - cell "kravene i § 15 om forholdet til arealplaner og vernetiltak er oppfylt," [ref=f18e327]
                                - table [ref=f18e328]:
                                  - rowgroup [ref=f18e329]:
                                    - row [ref=f18e330]:
                                      - cell "c." [ref=f18e331]
                                      - cell "avveiningen av arealinteresser etter § 16 er foretatt, og" [ref=f18e332]
                                - table [ref=f18e333]:
                                  - rowgroup [ref=f18e334]:
                                    - row [ref=f18e335]:
                                      - cell "d." [ref=f18e336]
                                      - cell "det er gitt tillatelser som kreves etter:" [ref=f18e337]
                                - table [ref=f18e338]:
                                  - rowgroup [ref=f18e339]:
                                    - row [ref=f18e340]:
                                      - cell "-" [ref=f18e341]
                                      - cell "lov 19. desember 2003 nr. 124 om matproduksjon og mattrygghet m.v.," [ref=f18e342]
                                - table [ref=f18e343]:
                                  - rowgroup [ref=f18e344]:
                                    - row [ref=f18e345]:
                                      - cell "-" [ref=f18e346]
                                      - cell "lov 13. mars 1981 nr. 6 om vern mot forurensning og om avfall," [ref=f18e347]
                                - table [ref=f18e348]:
                                  - rowgroup [ref=f18e349]:
                                    - row [ref=f18e350]:
                                      - cell "-" [ref=f18e351]
                                      - cell "havne- og farvannsloven, og" [ref=f18e352]
                                - table [ref=f18e353]:
                                  - rowgroup [ref=f18e354]:
                                    - row [ref=f18e355]:
                                      - cell "-" [ref=f18e356]
                                      - cell "lov 24. november 2000 nr. 82 om vassdrag og grunnvann." [ref=f18e357]
                                - paragraph [ref=f18e358]: Departementet kan i forskrift gi nærmere bestemmelser om tildeling av akvakulturtillatelse, herunder krav til søknad og kriterier for innvilgelse av søknad og gi nærmere bestemmelser om hvilke søknader som skal behandles av fylkeskommunene.
                                - paragraph [ref=f18e359]: Departementet kan i forskrift gi nærmere bestemmelser om hel eller delvis stans i tildeling for bestemte arter i bestemte tidsperioder eller geografiske områder, herunder om at søknader skal behandles i tildelingsrunder på bestemte tidspunkt.
                                - table [ref=f18e360]:
