                                  - rowgroup [ref=f18e393]:
                                    - row [ref=f18e394]:
                                      - cell "e." [ref=f18e395]
                                      - cell "vederlag for tildeling av tillatelser." [ref=f18e396]
                                - paragraph [ref=f18e397]: Departementet kan i forskrift gi nærmere bestemmelser om vederlag for utvidelse av gjeldende tillatelse.
                                - paragraph [ref=f18e398]: Departementet kan i forskrift bestemme hvor stor andel av produksjonskapasiteten et foretak kan kontrollere, herunder hvilke vilkår som skal gjelde for kontroll med en gitt andel mv.
                                - paragraph [ref=f18e399]: Kongen kan i forskrift gi bestemmelser om tilpasning av produksjonen av laks, ørret og regnbueørret.
                                - table [ref=f18e400]:
                                  - rowgroup [ref=f18e401]:
                                    - row [ref=f18e402]:
                                      - cell "0" [ref=f18e403]
                                      - cell "Endret ved lover 18 des 2009 nr. 136 (ikr. 1 jan 2010), 21 juni 2013 nr. 74 (ikr. 1 juli 2013 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e404]
                                - generic [ref=f18e405]: 🔗Del paragraf
                              - generic [ref=f18e406]:
                                - heading [level=3] [ref=f18e407]:
                                  - generic [ref=f18e408]:
                                    - text: § 8.
                                    - emphasis [ref=f18e410]: Samordning i saker om etablering av akvakultur
                                - paragraph [ref=f18e411]: Myndighetene etter denne lov, lovene nevnt i § 6 første ledd bokstav d og kommunen, herunder som plan- og bygningsmyndighet, plikter å foreta en effektiv og samordnet søknadsbehandling.
                                - paragraph [ref=f18e412]: Departementet kan i forskrift gi nærmere bestemmelser om samordning av søknadsbehandlingen, herunder fastsette tidsfrister for behandling av søknader.
                                - generic [ref=f18e413]: 🔗Del paragraf
                              - generic [ref=f18e414]:
                                - heading [level=3] [ref=f18e415]:
                                  - generic [ref=f18e416]:
                                    - text: § 9.
                                    - emphasis [ref=f18e418]: Tilpasning av produksjon av hensyn til miljøet, og endring og tilbaketrekking av akvakulturtillatelse
                                - paragraph [ref=f18e419]: "Departementet kan endre eller trekke tilbake akvakulturtillatelsen:"
                                - table [ref=f18e420]:
                                  - rowgroup [ref=f18e421]:
                                    - row [ref=f18e422]:
                                      - cell "a." [ref=f18e423]
                                      - cell "dersom dette er nødvendig ut fra hensynet til miljøet," [ref=f18e424]
                                - table [ref=f18e425]:
                                  - rowgroup [ref=f18e426]:
                                    - row [ref=f18e427]:
                                      - cell "b." [ref=f18e428]
                                      - cell "dersom vesentlige forutsetninger som ligger til grunn for tillatelsen er endret," [ref=f18e429]
                                - table [ref=f18e430]:
                                  - rowgroup [ref=f18e431]:
                                    - row [ref=f18e432]:
                                      - cell "c." [ref=f18e433]
                                      - cell "ved grov eller gjentatt overtredelse av bestemmelser gitt i eller i medhold av denne loven," [ref=f18e434]
                                - table [ref=f18e435]:
                                  - rowgroup [ref=f18e436]:
                                    - row [ref=f18e437]:
                                      - cell "d." [ref=f18e438]
                                      - cell "dersom tillatelsen ikke benyttes eller bare benyttes i begrenset grad, eller" [ref=f18e439]
                                - table [ref=f18e440]:
                                  - rowgroup [ref=f18e441]:
                                    - row [ref=f18e442]:
                                      - cell "e." [ref=f18e443]
                                      - cell "dersom en eller flere nødvendige tillatelser gitt i medhold av lovene nevnt i § 6 første ledd bokstav d er bortfalt." [ref=f18e444]
                                - paragraph [ref=f18e445]: Endring og tilbaketrekking av tillatelse etter første ledd kan gjøres tidsbegrenset. Tidsbegrenset endring og tilbaketrekking kan gjøres betinget av at bestemte forhold utbedres eller endres.
                                - paragraph [ref=f18e446]: Dersom det er nødvendig ut fra hensynet til miljøet, kan departementet i forskrift endre tillatelsers omfang og redusere muligheten til å utnytte tillatelser innenfor ett eller flere nærmere angitte områder.
                                - paragraph [ref=f18e447]: Departementet kan i forskrift gi nærmere bestemmelser om endring og tilbaketrekking av akvakulturtillatelser.
                                - table [ref=f18e448]:
                                  - rowgroup [ref=f18e449]:
                                    - row [ref=f18e450]:
                                      - cell "0" [ref=f18e451]
                                      - cell "Endret ved lov 21 juni 2019 nr. 64 (ikr. 1 juli 2019 iflg. res. 21 juni 2019 nr. 859)." [ref=f18e452]
                                - generic [ref=f18e453]: 🔗Del paragraf
                            - generic [ref=f18e454]:
                              - heading "Kapittel III. Miljøhensyn" [level=2] [ref=f18e455]
                              - generic [ref=f18e456]:
                                - heading [level=3] [ref=f18e457]:
                                  - generic [ref=f18e458]:
                                    - text: § 10.
                                    - emphasis [ref=f18e460]: Miljønorm
                                - paragraph [ref=f18e461]: Akvakultur skal etableres, drives og avvikles på en miljømessig forsvarlig måte.
                                - paragraph [ref=f18e462]: Departementet kan i enkeltvedtak eller forskrift gi nærmere bestemmelser for å sikre miljømessig forsvarlig akvakultur, herunder stille krav til forebyggende tiltak, krav om merking av akvatiske organismer, bruk av akvatiske organismer som ikke kan formere seg og bruk av fremmede organismer.
                                - table [ref=f18e463]:
                                  - rowgroup [ref=f18e464]:
                                    - row [ref=f18e465]:
                                      - cell "0" [ref=f18e466]
                                      - cell "Endret ved lov 21 juni 2013 nr. 74 (ikr. 1 juli 2013 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e467]
                                - generic [ref=f18e468]: 🔗Del paragraf
                              - generic [ref=f18e469]:
                                - heading [level=3] [ref=f18e470]:
                                  - generic [ref=f18e471]:
                                    - text: § 11.
                                    - emphasis [ref=f18e473]: Miljøovervåking
                                - paragraph [ref=f18e474]: Departementet kan i enkeltvedtak eller forskrift kreve at den som har eller søker om akvakulturtillatelse skal foreta eller bekoste nødvendige miljøundersøkelser for å dokumentere miljøtilstanden innenfor lokalitetens influensområde ved etablering, drift og avvikling av akvakultur.
                                - paragraph [ref=f18e475]: Miljøundersøkelser etter denne bestemmelsen kan blant annet omfatte undersøkelser for å klarlegge om og hvordan akvakulturvirksomheten forårsaker, har forårsaket eller kan forårsake påvirkning på miljøet.
                                - paragraph [ref=f18e476]: Departementet kan gi forskrift om gebyr og avgift for gjennomføring av miljøundersøkelser i regi av det offentlige. Skyldig gebyr og avgift er tvangsgrunnlag for utlegg.
                                - table [ref=f18e477]:
                                  - rowgroup [ref=f18e478]:
                                    - row [ref=f18e479]:
                                      - cell "0" [ref=f18e480]
                                      - cell "Endret ved lov 21 juni 2013 nr. 74 (ikr. 1 juli 2013 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e481]
                                - generic [ref=f18e482]: 🔗Del paragraf
                              - generic [ref=f18e483]:
                                - heading [level=3] [ref=f18e484]:
                                  - generic [ref=f18e485]:
                                    - text: § 12.
                                    - emphasis [ref=f18e487]: Krav til vare- og tjenesteprodusenter, innretninger, utstyr mv.
                                - paragraph [ref=f18e488]: Vare- og tjenesteprodusenter til akvakulturnæringen skal utføre sine oppdrag og tjenester på en miljømessig forsvarlig måte. Departementet kan i forskrift gi nærmere bestemmelser for å sikre forsvarlig gjennomføring av aktiviteter utført av vare- og tjenesteprodusenter.
                                - paragraph [ref=f18e489]: Innretninger og utstyr som nyttes til aktiviteter som omfattes av denne lov skal være forsvarlig utformet, ha forsvarlige egenskaper og brukes med nødvendig aktsomhet.
                                - paragraph [ref=f18e490]: Departementet kan gi forskrift om krav til tilvirkning, bruk og egenskaper ved innretninger og utstyr som nevnt i annet ledd, herunder fastsette godkjennings- og sertifiseringsordninger.
                                - table [ref=f18e491]:
                                  - rowgroup [ref=f18e492]:
                                    - row [ref=f18e493]:
                                      - cell "0" [ref=f18e494]
                                      - cell "Endret ved lov 21 juni 2013 nr. 74 (ikr. 1 juli 2013 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e495]
                                - generic [ref=f18e496]: 🔗Del paragraf
                              - generic [ref=f18e497]:
                                - heading [level=3] [ref=f18e498]:
                                  - generic [ref=f18e499]:
                                    - text: § 13.
                                    - emphasis [ref=f18e501]: Oppryddings- og gjenfangstplikt
                                - paragraph [ref=f18e502]: Den som driver akvakultur skal ved helt eller delvis opphør av produksjonen foreta opprydding på lokaliteten og tilstøtende områder, herunder fjerning av organismer, innretninger og utstyr mv.
                                - paragraph [ref=f18e503]: Departementet kan i enkeltvedtak eller forskrift gi bestemmelser om at den som driver akvakultur har plikt til gjenfangst av den utsatte art.
                                - paragraph [ref=f18e504]: Departementet kan gi forskrift om plikt til å stille sikkerhet for oppryddings- og gjenfangstplikten etter første og annet ledd.
                                - paragraph [ref=f18e505]: Departementet kan gi forskrift om avgiftsordning for å sikre gjennomføring av oppryddings- og gjenfangstplikten. Fastsatt avgift er tvangsgrunnlag for utlegg.
                                - generic [ref=f18e506]: 🔗Del paragraf
                              - generic [ref=f18e507]:
                                - heading [level=3] [ref=f18e508]:
                                  - generic [ref=f18e509]:
                                    - text: § 13 a.
                                    - emphasis [ref=f18e511]: Fellesansvar for fjerning av rømte organismer
                                - paragraph [ref=f18e512]: Innehaver av akvakulturtillatelse plikter å delta i en sammenslutning opprettet av departementet og å betale avgift til sammenslutningen.
                                - paragraph [ref=f18e513]: Sammenslutningen skal, med de begrensninger som er fastsatt i forskrift, dekke utgifter det offentlige eller private har med fjerning av organismer som har rømt eller på annen uønsket måte har spredt seg fra en lokalitet for akvakultur. Sammenslutningen skal også dekke utgifter til fjerning av organismer som innehaver av tillatelse er pliktig til å dekke etter § 13, dersom den ansvarlige er ukjent. Dersom den rømte akvatiske organismen kan spores tilbake til en innehaver av akvakulturtillatelse, kan sammenslutningen kreve regress hos den ansvarlige.
                                - paragraph [ref=f18e514]: Innehavere av akvakulturtillatelse svarer én for alle og alle for én på objektivt grunnlag for sammenslutningens utgifter.
                                - paragraph [ref=f18e515]: Departementet kan i forskrift gi nærmere bestemmelser om sammenslutningens ikrafttreden, organisering og virksomhet, herunder om unntak fra plikten til medlemskap, årlig avgift for deltakelse i sammenslutningen og tilleggsinnbetalinger, begrensninger i ansvaret etter annet og tredje ledd og utbetaling.
                                - paragraph [ref=f18e516]: Manglende innbetaling av avgift for deltakelse i sammenslutningen er tvangsgrunnlag for utlegg.
                                - table [ref=f18e517]:
                                  - rowgroup [ref=f18e518]:
                                    - row [ref=f18e519]:
                                      - cell "0" [ref=f18e520]
                                      - cell "Tilføyd ved lov 21 juni 2013 nr. 74 (ikr. 1 juli 2014 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e521]
                                - generic [ref=f18e522]: 🔗Del paragraf
                              - generic [ref=f18e523]:
                                - heading [level=3] [ref=f18e524]:
                                  - generic [ref=f18e525]:
                                    - text: § 14.
                                    - emphasis [ref=f18e527]: Beskyttelse av bestemte områder
                                - paragraph [ref=f18e528]: Departementet kan fastsette forbud mot, pålegge flytting av eller sette andre vilkår for akvakultur dersom dette er nødvendig for å bevare områder med særlig verdi for akvatiske organismer.
                                - generic [ref=f18e529]: 🔗Del paragraf
                            - generic [ref=f18e530]:
                              - heading "Kapittel IV. Arealutnyttelse" [level=2] [ref=f18e531]
                              - generic [ref=f18e532]:
                                - heading [level=3] [ref=f18e533]:
                                  - generic [ref=f18e534]:
                                    - text: § 15.
                                    - emphasis [ref=f18e536]: Forholdet til arealplaner og vernetiltak
                                - paragraph [ref=f18e537]: "Tillatelse til akvakultur kan ikke gis i strid med:"
                                - table [ref=f18e538]:
                                  - rowgroup [ref=f18e539]:
                                    - row [ref=f18e540]:
                                      - cell "a." [ref=f18e541]
                                      - cell "vedtatte arealplaner etter plan- og bygningsloven," [ref=f18e542]
                                - table [ref=f18e543]:
                                  - rowgroup [ref=f18e544]:
                                    - row [ref=f18e545]:
                                      - cell "b." [ref=f18e546]
                                      - cell "vedtatte vernetiltak etter kapittel V i lov 19. juni 2009 nr. 100 om forvaltning av naturens mangfold," [ref=f18e547]
                                - table [ref=f18e548]:
                                  - rowgroup [ref=f18e549]:
                                    - row [ref=f18e550]:
                                      - cell "c." [ref=f18e551]
                                      - cell "vedtatte vernetiltak etter lov 9. juni 1978 nr. 50 om kulturminner, eller" [ref=f18e552]
                                - table [ref=f18e553]:
                                  - rowgroup [ref=f18e554]:
                                    - row [ref=f18e555]:
                                      - cell "d." [ref=f18e556]
                                      - cell "vedtatte vernetiltak etter lov 10. juni 2025 nr. 33 om vern av marin natur utenfor territorialfarvannet." [ref=f18e557]
                                - paragraph [ref=f18e558]: Tillatelse til akvakultur kan likevel gis dersom det foreligger samtykke fra vedkommende plan- eller vernemyndighet.
                                - table [ref=f18e559]:
                                  - rowgroup [ref=f18e560]:
                                    - row [ref=f18e561]:
                                      - cell "0" [ref=f18e562]
                                      - cell "Endret ved lover 19 juni 2009 nr. 100 (ikr. 1 juli 2009 iflg. res. 19 juni 2009 nr. 704), 27 juni 2008 nr. 71 (ikr. 1 juli 2010 iflg. res. 18 juni 2010 nr. 896, endring endret ved lov 8 mai 2009 nr. 27), 10 juni 2025 nr. 33 (i kraft 1 jan 2026 iflg. res. 10 juni 2025 nr. 966)." [ref=f18e563]
                                - generic [ref=f18e564]: 🔗Del paragraf
                              - generic [ref=f18e565]:
                                - heading [level=3] [ref=f18e566]:
                                  - generic [ref=f18e567]:
                                    - text: § 16.
                                    - emphasis [ref=f18e569]: Interesseavveining ved arealbruk til akvakultur
                                - paragraph [ref=f18e570]: "Departementet skal foreta en avveining av arealinteresser ved plassering av lokaliteter til akvakultur. Det skal særlig legge vekt på:"
                                - table [ref=f18e571]:
                                  - rowgroup [ref=f18e572]:
                                    - row [ref=f18e573]:
                                      - cell "a." [ref=f18e574]
                                      - cell "søkers behov for areal til planlagt akvakulturproduksjon," [ref=f18e575]
                                - table [ref=f18e576]:
                                  - rowgroup [ref=f18e577]:
                                    - row [ref=f18e578]:
                                      - cell "b." [ref=f18e579]
                                      - cell "alternativ bruk av området til annen akvakultur," [ref=f18e580]
                                - table [ref=f18e581]:
                                  - rowgroup [ref=f18e582]:
                                    - row [ref=f18e583]:
                                      - cell "c." [ref=f18e584]
                                      - cell "annen bruk av området, og" [ref=f18e585]
                                - table [ref=f18e586]:
                                  - rowgroup [ref=f18e587]:
                                    - row [ref=f18e588]:
                                      - cell "d." [ref=f18e589]
                                      - cell "verneinteresser som ikke omfattes av § 15 bokstav b og c." [ref=f18e590]
                                - paragraph [ref=f18e591]: Departementet kan i forskrift gi nærmere bestemmelser om bruk og plassering av lokaliteter til akvakultur.
                                - paragraph [ref=f18e592]: Departementet kan i forskrift gi nærmere bestemmelser om pålegg om flytting av akvakulturanlegg innenfor et nærmere definert geografisk område dersom overordnede samfunns- og næringsmessige hensyn, herunder hensynet til fiskehelse og miljø tilsier dette. Departementet kan også i forskrift gi nærmere bestemmelser om prosedyrer for initiering og gjennomføring av prosesser med sikte på flytting, herunder prinsipper for dekning av kostnader.
                                - table [ref=f18e593]:
                                  - rowgroup [ref=f18e594]:
                                    - row [ref=f18e595]:
                                      - cell "0" [ref=f18e596]
                                      - cell "Endret ved lov 19 juni 2009 nr. 61 (ikr. 1 juli 2009 iflg. res. 19 juni 2009 nr. 695)." [ref=f18e597]
                                - generic [ref=f18e598]: 🔗Del paragraf
                              - generic [ref=f18e599]:
                                - heading [level=3] [ref=f18e600]:
                                  - generic [ref=f18e601]:
                                    - text: § 17.
                                    - emphasis [ref=f18e603]: Utnytting og bruk av lokaliteter mv.
                                - paragraph [ref=f18e604]: Den som har akvakulturtillatelse har enerett til uttak og gjenfangst av den utsatte arten på lokaliteten.
                                - paragraph [ref=f18e605]: Departementet kan i enkeltvedtak eller forskrift regulere uttak og gjenfangst av den enkelte art på lokaliteten uavhengig av bestemmelsene i lov om forvaltning av viltlevande marine ressursar.
                                - paragraph [ref=f18e606]: Departementet kan i forskrift avgrense eller forby ferdsel og annen bruk av lokaliteter samt tilstøtende områder, herunder fiske etter andre arter enn den utsatte art, dersom dette er nødvendig av hensyn til akvakulturproduksjonen.
                                - table [ref=f18e607]:
                                  - rowgroup [ref=f18e608]:
                                    - row [ref=f18e609]:
                                      - cell "0" [ref=f18e610]
                                      - cell "Endret ved lov 6 juni 2008 nr. 37 (ikr. 1 jan 2009 iflg. res. 12 des 2008 nr. 1355)." [ref=f18e611]
                                - generic [ref=f18e612]: 🔗Del paragraf
                            - generic [ref=f18e613]:
                              - heading "Kapittel V. Registrering, overføring og pantsettelse av akvakulturtillatelse" [level=2] [ref=f18e614]
                              - generic [ref=f18e615]:
                                - heading [level=3] [ref=f18e616]:
                                  - generic [ref=f18e617]:
                                    - text: § 18.
                                    - emphasis [ref=f18e619]: Registrering av akvakulturtillatelse
                                - paragraph [ref=f18e620]: Det skal føres et register over akvakulturtillatelser (akvakulturregisteret). I registeret gis den enkelte tillatelse et eget blad.
                                - paragraph [ref=f18e621]: Det skal føres dagbok over de rettsstiftelser som skal registreres.
                                - paragraph [ref=f18e622]: Departementet kan gi forskrift om registreringsordningen, herunder om registreringsmyndighet, erstatningsordning, føring av dagbok mv. Departementet kan i forskrift gi nærmere bestemmelser om fylkeskommunenes oppgaver knyttet til registreringsordningen.
                                - paragraph [ref=f18e623]: Reglene i lov 7. juni 1935 nr. 2 om tinglysing kapittel 2 og 3 og § 35 gjelder tilsvarende så langt de passer og ikke annet følger av bestemmelser gitt i eller i medhold av denne lov.
                                - table [ref=f18e624]:
                                  - rowgroup [ref=f18e625]:
                                    - row [ref=f18e626]:
                                      - cell "0" [ref=f18e627]
                                      - cell "Endret ved lov 9 jan 2009 nr. 4 (ikr. 1 jan 2010)." [ref=f18e628]
                                - generic [ref=f18e629]: 🔗Del paragraf
                              - generic [ref=f18e630]:
                                - heading [level=3] [ref=f18e631]:
                                  - generic [ref=f18e632]:
                                    - text: § 19.
                                    - emphasis [ref=f18e634]: Overføring av akvakulturtillatelse
                                - paragraph [ref=f18e635]: Akvakulturtillatelse kan overføres.
                                - paragraph [ref=f18e636]: Overføring av akvakulturtillatelse har ikke betydning for myndighetenes bruk av virkemidler etter denne lov.
                                - paragraph [ref=f18e637]: Utleie av akvakulturtillatelser er ikke tillatt. Departementet kan i særlige tilfeller gjøre unntak fra forbudet mot utleie.
                                - paragraph [ref=f18e638]: Departementet kan i forskrift gi nærmere bestemmelser om overføring av akvakulturtillatelser.
                                - generic [ref=f18e639]: 🔗Del paragraf
                              - generic [ref=f18e640]:
                                - heading [level=3] [ref=f18e641]:
                                  - generic [ref=f18e642]:
                                    - text: § 20.
                                    - emphasis [ref=f18e644]: Pantsettelse av akvakulturtillatelse
                                - paragraph [ref=f18e645]: Akvakulturtillatelse kan pantsettes.
                                - paragraph [ref=f18e646]: Panteretten får rettsvern ved tinglysing på tillatelsens blad i akvakulturregisteret.
                                - paragraph [ref=f18e647]: Pantsettelse av akvakulturtillatelse har ikke betydning for myndighetenes bruk av virkemidler etter denne lov.
                                - paragraph [ref=f18e648]: Staten har panterett foran alle andre heftelser i tillatelsen for krav på tvangsmulkt etter § 28, krav om dekning av utgifter til iverksetting etter § 29, inndragning etter § 29 a og overtredelsesgebyr etter § 30.
                                - paragraph [ref=f18e649]: Departementet kan i forskrift gi nærmere bestemmelser om pantsettelse av akvakulturtillatelser, herunder om beløpsmessig begrensning av statens panterett etter fjerde ledd.
                                - table [ref=f18e650]:
                                  - rowgroup [ref=f18e651]:
                                    - row [ref=f18e652]:
                                      - cell "0" [ref=f18e653]
                                      - cell "Endret ved lov 21 juni 2013 nr. 74 (ikr. 1 juli 2013 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e654]
                                - generic [ref=f18e655]: 🔗Del paragraf
                            - generic [ref=f18e656]:
                              - heading "Kapittel VI. Generelle krav og forpliktelser" [level=2] [ref=f18e657]
                              - generic [ref=f18e658]:
                                - heading [level=3] [ref=f18e659]:
                                  - generic [ref=f18e660]:
                                    - text: § 21.
                                    - emphasis [ref=f18e662]: Tilsyn
                                - paragraph [ref=f18e663]: Departementet bestemmer hvem som er tilsynsmyndighet etter denne lov. Tilsynsmyndigheten skal føre tilsyn med at bestemmelsene i og i medhold av denne lov blir overholdt.
                                - generic [ref=f18e664]: 🔗Del paragraf
                              - generic [ref=f18e665]:
                                - heading [level=3] [ref=f18e666]:
                                  - generic [ref=f18e667]:
                                    - text: § 22.
                                    - emphasis [ref=f18e669]: Faglig kompetanse
                                - paragraph [ref=f18e670]: Enhver som deltar i aktiviteter som omfattes av denne lov skal ha nødvendig faglig kompetanse for slik aktivitet.
                                - paragraph [ref=f18e671]: Departementet kan i forskrift gi nærmere bestemmelser om krav til faglig kompetanse for aktiviteter som omfattes av denne lov.
                                - generic [ref=f18e672]: 🔗Del paragraf
                              - generic [ref=f18e673]:
                                - heading [level=3] [ref=f18e674]:
                                  - generic [ref=f18e675]:
                                    - text: § 22 a.
                                    - emphasis [ref=f18e677]: Lønnsvilkår på skip
                                - paragraph [ref=f18e678]: Innehavere av akvakulturtillatelser skal sørge for at ansatte på skip som leverer tjenester til akvakulturproduksjon, ikke har dårligere lønnsvilkår enn det som følger av gjeldende landsomfattende tariffavtaler. Kongen kan gi forskrift om hvordan forpliktelsene til innehavere av akvakulturtillatelser kan oppfylles.
                                - table [ref=f18e679]:
                                  - rowgroup [ref=f18e680]:
                                    - row [ref=f18e681]:
                                      - cell "0" [ref=f18e682]
                                      - cell "Tilføyd ved lov 20 juni 2025 nr. 109 (i kraft 1 jan 2026)." [ref=f18e683]
                                - generic [ref=f18e684]: 🔗Del paragraf
                              - generic [ref=f18e685]:
                                - heading [level=3] [ref=f18e686]:
                                  - generic [ref=f18e687]:
                                    - text: § 23.
                                    - emphasis [ref=f18e689]: Systematiske kontrolltiltak
                                - paragraph [ref=f18e690]: For å sikre at krav i eller i medhold av loven overholdes kan departementet i forskrift bestemme at den som driver aktiviteter som omfattes av denne lov har plikt til å etablere og gjennomføre systematiske kontrolltiltak.
                                - generic [ref=f18e691]: 🔗Del paragraf
                              - generic [ref=f18e692]:
                                - heading [level=3] [ref=f18e693]:
                                  - generic [ref=f18e694]:
                                    - text: § 24.
                                    - emphasis [ref=f18e696]: Opplysnings- og undersøkelsesplikt
                                - paragraph [ref=f18e697]: Etter pålegg fra tildelings- og tilsynsmyndigheten plikter enhver som søker om eller driver aktiviteter som omfattes av denne lov, å gi opplysninger, dokumenter, prøvemateriale eller annet materiale som er nødvendig for at tildelings- og tilsynsmyndigheten skal kunne utføre sine oppgaver etter loven.
                                - paragraph [ref=f18e698]: Etter pålegg fra tildelings- og tilsynsmyndigheten plikter enhver som søker om eller driver aktiviteter som omfattes av denne lov å gjennomføre undersøkelser som er nødvendige for at tildelings- og tilsynsmyndigheten skal kunne utføre sine oppgaver etter loven.
                                - paragraph [ref=f18e699]: Departementet kan i forskrift gi nærmere bestemmelser om opplysnings- og undersøkelsesplikten i første og annet ledd, herunder om at pliktene skal utføres jevnlig.
                                - paragraph [ref=f18e700]: Departementet kan i forskrift gi bestemmelser om at den som driver aktiviteter som omfattes av denne lov, skal ha og bruke utstyr og programvare med bestemt funksjon for rapportering etter denne bestemmelsen.
                                - table [ref=f18e701]:
                                  - rowgroup [ref=f18e702]:
                                    - row [ref=f18e703]:
                                      - cell "0" [ref=f18e704]
                                      - cell "Endret ved lover 9 jan 2009 nr. 4 (ikr. 1 jan 2010), 21 juni 2013 nr. 74 (ikr. 1 juli 2013 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e705]
                                - generic [ref=f18e706]: 🔗Del paragraf
                              - generic [ref=f18e707]:
                                - heading [level=3] [ref=f18e708]:
                                  - generic [ref=f18e709]:
                                    - text: § 25.
                                    - emphasis [ref=f18e711]: Bistandsplikt
                                - paragraph [ref=f18e712]: Enhver som driver aktiviteter som omfattes av denne lov plikter å gi tilsynsmyndighetene adgang til områder, innretning og utstyr i tilknytning til aktiviteten, for at tilsynsmyndigheten skal kunne utføre sine oppgaver etter loven.
                                - paragraph [ref=f18e713]: Enhver som driver aktiviteter som omfattes av denne lov skal stille nødvendige lokaler, utstyr, materiell, organismer og arbeidshjelp til disposisjon for utøvelse av tilsynet og ellers yte bistand for gjennomføring av tilsynsarbeidet.
                                - generic [ref=f18e714]: 🔗Del paragraf
                              - generic [ref=f18e715]:
                                - heading [level=3] [ref=f18e716]:
                                  - generic [ref=f18e717]:
                                    - text: § 25 a.
                                    - emphasis [ref=f18e719]: Utveksling av opplysninger mellom myndigheter
                                - paragraph [ref=f18e720]: Tildelings- og tilsynsmyndigheter etter denne loven kan uten hinder av taushetsplikt gi opplysninger til kontroll-, politi- eller påtalemyndigheter dersom avgivelsen har sammenheng med deres oppgaver etter loven.
                                - paragraph [ref=f18e721]: Taushetsplikt for andre kontroll-, politi- eller påtalemyndigheter hindrer ikke at disse gir tilsynsmyndigheter etter denne loven opplysninger som har naturlig sammenheng med deres oppgaver etter denne loven.
                                - paragraph [ref=f18e722]: Kongen kan i forskrift gi nærmere bestemmelser om utveksling av opplysninger etter denne bestemmelsen.
                                - table [ref=f18e723]:
                                  - rowgroup [ref=f18e724]:
                                    - row [ref=f18e725]:
                                      - cell "0" [ref=f18e726]
                                      - cell "Tilføyd ved lov 21 juni 2013 nr. 74 (ikr. 1 juli 2013 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e727]
                                - generic [ref=f18e728]: 🔗Del paragraf
                              - generic [ref=f18e729]:
                                - heading [level=3] [ref=f18e730]:
                                  - generic [ref=f18e731]:
                                    - text: § 26.
                                    - emphasis [ref=f18e733]: Gebyr og avgift
                                - paragraph [ref=f18e734]: Departementet kan gi forskrift om gebyr og avgift, for behandling av søknader og for utførelse av tilsynsarbeid i henhold til bestemmelser i eller i medhold av denne lov.
                                - paragraph [ref=f18e735]: Skyldig gebyr og avgift er tvangsgrunnlag for utlegg.
                                - table [ref=f18e736]:
                                  - rowgroup [ref=f18e737]:
                                    - row [ref=f18e738]:
                                      - cell "0" [ref=f18e739]
                                      - cell "Endret ved lover 29 juni 2007 nr. 77 (ikr. 1 juli 2007 iflg. res. 29 juni 2007 nr. 756), 21 juni 2013 nr. 74 (ikr. 1 juli 2013 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e740]
                                - generic [ref=f18e741]: 🔗Del paragraf
                            - generic [ref=f18e742]:
                              - heading "Kapittel VII. Reaksjoner og sanksjoner ved overtredelse" [level=2] [ref=f18e743]
                              - table [ref=f18e744]:
                                - rowgroup [ref=f18e745]:
                                  - row [ref=f18e746]:
                                    - cell "0" [ref=f18e747]
                                    - cell "Overskriften endret ved lov 21 juni 2013 nr. 74 (ikr. 1 juli 2013 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e748]
                              - generic [ref=f18e749]:
                                - heading [level=3] [ref=f18e750]:
                                  - generic [ref=f18e751]:
                                    - text: § 27.
                                    - emphasis [ref=f18e753]: Pålegg om tiltak
                                - paragraph [ref=f18e754]: Ved overtredelse av bestemmelser gitt i eller i medhold av loven kan tilsynsmyndigheten gi pålegg om tiltak for å bringe de ulovlige forhold til opphør. Det kan fastsettes frist for gjennomføring av slike tiltak.
                                - generic [ref=f18e755]: 🔗Del paragraf
                              - generic [ref=f18e756]:
                                - heading [level=3] [ref=f18e757]:
                                  - generic [ref=f18e758]:
                                    - text: § 28.
                                    - emphasis [ref=f18e760]: Tvangsmulkt
                                - paragraph [ref=f18e761]: For å sikre at bestemmelser gitt i eller i medhold av denne lov blir gjennomført, kan tilsynsmyndigheten fatte vedtak om løpende tvangsmulkt overfor den ansvarlige. Det kan også vedtas tvangsmulkt som forfaller for hver overtredelse. Tvangsmulkt kan vedtas samtidig med pålegg etter § 27 eller senere.
                                - paragraph [ref=f18e762]: Tvangsmulkten begynner å løpe dersom den ansvarlige oversitter den frist for retting av forholdet som tilsynsmyndigheten har fastsatt i vedtaket om tvangsmulkt, og løper så lenge det ulovlige forholdet varer. Tvangsmulkt kan ikke fastsettes, og den løper heller ikke, så langt det på grunn av forhold som ikke skyldes den ansvarlige, er umulig å oppfylle eller å etterleve det pålegget som tvangsmulkten er knyttet til.
                                - paragraph [ref=f18e763]: Der flere er ansvarlige etter vedtak om tvangsmulkt, hefter de ansvarlige solidarisk for betaling av tvangsmulkten. Dersom den ansvarlige for påløpt tvangsmulkt er et selskap som inngår i et konsern, hefter selskapets morselskap og morselskapet i det konsern selskapet er en del av, subsidiært for beløpet. Tvangsmulkt er tvangsgrunnlag for utlegg. Departementet kan i særlige tilfeller frafalle påløpt tvangsmulkt.
                                - paragraph [ref=f18e764]: Departementet kan i forskrift gi nærmere bestemmelser om tvangsmulkt, herunder tvangsmulktens størrelse og varighet, fastsettelse av tvangsmulkt og frafall av påløpt tvangsmulkt.
                                - table [ref=f18e765]:
                                  - rowgroup [ref=f18e766]:
                                    - row [ref=f18e767]:
                                      - cell "0" [ref=f18e768]
                                      - cell "Endret ved lov 21 juni 2013 nr. 74 (ikr. 1 juli 2013 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e769]
                                - generic [ref=f18e770]: 🔗Del paragraf
                              - generic [ref=f18e771]:
                                - heading [level=3] [ref=f18e772]:
                                  - generic [ref=f18e773]:
                                    - text: § 29.
                                    - emphasis [ref=f18e775]: Iverksetting av tiltak for den ansvarliges regning
                                - paragraph [ref=f18e776]: Dersom fristen for å etterkomme pålegg etter § 27 er utløpt, kan tilsynsmyndigheten sørge for iverksetting av tiltakene.
                                - paragraph [ref=f18e777]: Selv om det ikke er gitt pålegg etter § 27 kan tilsynsmyndigheten, dersom det er nødvendig å iverksette tiltaket straks eller det foreligger andre særlige grunner, sørge for iverksetting av tiltak for å bringe ulovlige forhold til opphør.
                                - paragraph [ref=f18e778]: Utgifter til iverksetting etter første og annet ledd kan kreves dekket av den ansvarlige. Der flere er ansvarlige, hefter de ansvarlige solidarisk for utgiftene. Krav om utgifter til iverksetting er tvangsgrunnlag for utlegg.
                                - paragraph [ref=f18e779]: Departementet kan i forskrift gi nærmere bestemmelser om iverksetting av tiltak, herunder om innkreving av utgiftene til iverksetting.
                                - generic [ref=f18e780]: 🔗Del paragraf
                              - generic [ref=f18e781]:
                                - heading [level=3] [ref=f18e782]:
                                  - generic [ref=f18e783]:
                                    - text: § 29 a.
                                    - emphasis [ref=f18e785]: Administrativ inndragning av utbytte
                                - paragraph [ref=f18e786]: Tilsynsmyndigheten kan helt eller delvis inndra utbytte som er oppnådd gjennom overtredelse av bestemmelser gitt i eller i medhold av loven. Inndragning foretas overfor den som utbyttet har tilfalt. Inndragning kan bare skje så langt dette ikke vil være klart urimelig.
                                - paragraph [ref=f18e787]: Dersom den som utbyttet har tilfalt er et selskap som inngår i et konsern, hefter selskapets morselskap og morselskapet i det konsern selskapet er en del av, subsidiært for beløpet.
                                - paragraph [ref=f18e788]: Endelig vedtak om inndragning av utbytte er tvangsgrunnlag for utlegg. Inndratt utbytte tilfaller statskassen.
                                - paragraph [ref=f18e789]: Retten kan prøve alle sider av saken. Retten kan avsi dom for realitet i saken, dersom den finner det hensiktsmessig og forsvarlig.
                                - paragraph [ref=f18e790]: Departementet kan i forskrift gi nærmere bestemmelser om inndragning, herunder om standardisert eller skjønnsmessig utmåling av utbytte og fradrag for utgifter.
                                - table [ref=f18e791]:
                                  - rowgroup [ref=f18e792]:
                                    - row [ref=f18e793]:
                                      - cell "0" [ref=f18e794]
                                      - cell "Tilføyd ved lov 21 juni 2013 nr. 74 (ikr. 1 jan 2014 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e795]
                                - generic [ref=f18e796]: 🔗Del paragraf
                              - generic [ref=f18e797]:
                                - heading [level=3] [ref=f18e798]:
                                  - generic [ref=f18e799]:
                                    - text: § 30.
                                    - emphasis [ref=f18e801]: Overtredelsesgebyr
                                - paragraph [ref=f18e802]: Et foretak kan ilegges overtredelsesgebyr dersom foretaket eller noen som har handlet på foretakets vegne overtrer bestemmelser gitt i eller i medhold av loven. Dette gjelder selv om ansvaret for overtredelsen ikke kan rettes mot noen enkeltperson.
                                - paragraph [ref=f18e803]: "Ved avgjørelsen av om foretaket skal ilegges overtredelsesgebyr og ved utmålingen av gebyret kan det særlig legges vekt på:"
                                - table [ref=f18e804]:
                                  - rowgroup [ref=f18e805]:
                                    - row [ref=f18e806]:
                                      - cell "a." [ref=f18e807]
                                      - cell "overtredelsesgebyrets preventive virkning," [ref=f18e808]
                                - table [ref=f18e809]:
                                  - rowgroup [ref=f18e810]:
                                    - row [ref=f18e811]:
                                      - cell "b." [ref=f18e812]
                                      - cell "overtredelsens grovhet," [ref=f18e813]
                                - table [ref=f18e814]:
                                  - rowgroup [ref=f18e815]:
                                    - row [ref=f18e816]:
                                      - cell "c." [ref=f18e817]
                                      - cell "om foretaket ved internkontroll, retningslinjer, instruksjon, opplæring eller andre tiltak kunne ha forebygget overtredelsen," [ref=f18e818]
                                - table [ref=f18e819]:
                                  - rowgroup [ref=f18e820]:
                                    - row [ref=f18e821]:
                                      - cell "d." [ref=f18e822]
                                      - cell "om overtredelsen er begått for å fremme foretakets interesser," [ref=f18e823]
                                - table [ref=f18e824]:
                                  - rowgroup [ref=f18e825]:
                                    - row [ref=f18e826]:
                                      - cell "e." [ref=f18e827]
                                      - cell "om foretaket har hatt eller kunne oppnådd noen fordel ved overtredelsen," [ref=f18e828]
                                - table [ref=f18e829]:
                                  - rowgroup [ref=f18e830]:
                                    - row [ref=f18e831]:
                                      - cell "f." [ref=f18e832]
                                      - cell "foretakets økonomiske evne," [ref=f18e833]
                                - table [ref=f18e834]:
                                  - rowgroup [ref=f18e835]:
                                    - row [ref=f18e836]:
                                      - cell "g." [ref=f18e837]
                                      - cell "om det foreligger gjentakelse," [ref=f18e838]
                                - table [ref=f18e839]:
                                  - rowgroup [ref=f18e840]:
                                    - row [ref=f18e841]:
                                      - cell "h." [ref=f18e842]
                                      - cell "hvilke tiltak som er iverksatt for å forebygge eller avbøte virkningene av overtredelsen og" [ref=f18e843]
                                - table [ref=f18e844]:
                                  - rowgroup [ref=f18e845]:
                                    - row [ref=f18e846]:
                                      - cell "i." [ref=f18e847]
                                      - cell "om overtredelsen innebærer fare for eller har ført til alvorlig eller uopprettelig miljøskade." [ref=f18e848]
                                - paragraph [ref=f18e849]: Dersom den ansvarlige for overtredelsesgebyret er et foretak som inngår i et konsern, hefter foretakets morselskap og morselskapet i det konsern selskapet er en del av, subsidiært for beløpet.
                                - paragraph [ref=f18e850]: Overtredelsesgebyret forfaller til betaling 2 måneder fra vedtak er fattet. Endelig vedtak om overtredelsesgebyr er tvangsgrunnlag for utlegg. Dersom foretaket går til søksmål mot staten for å prøve vedtaket, suspenderes tvangskraften.
                                - paragraph [ref=f18e851]: Retten kan prøve alle sider av saken. Retten kan avsi dom for realitet i saken, dersom den finner det hensiktsmessig og forsvarlig.
                                - paragraph [ref=f18e852]: Adgangen til å ilegge overtredelsesgebyr foreldes 2 år etter at overtredelsen er opphørt. Fristen avbrytes ved at tilsynsmyndigheten gir forhåndsvarsel eller fatter vedtak om overtredelsesgebyr.
                                - paragraph [ref=f18e853]: Departementet skal i forskrift fastsette et øvre tak for overtredelsesgebyr ilagt etter denne bestemmelsen. Departementet kan i forskrift fastsette nærmere regler om utmålingen av overtredelsesgebyr.
                                - table [ref=f18e854]:
                                  - rowgroup [ref=f18e855]:
                                    - row [ref=f18e856]:
                                      - cell "0" [ref=f18e857]
                                      - cell "Endret ved lov 21 juni 2013 nr. 74 (ikr. 1 jan 2014 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e858]
                                - generic [ref=f18e859]: 🔗Del paragraf
                              - generic [ref=f18e860]:
                                - heading [level=3] [ref=f18e861]:
                                  - generic [ref=f18e862]:
                                    - text: § 31.
                                    - emphasis [ref=f18e864]: Straff
                                - paragraph [ref=f18e865]: Den som forsettlig eller grovt uaktsomt vesentlig overtrer bestemmelsene gitt i eller i medhold av §§ 4, 5, 10, 12, 13, 14, 17, 19, 22, 23, 24 og 25, straffes med bøter eller fengsel inntil 1 år eller begge deler, dersom forholdet ikke rammes av strengere straffebestemmelse.
                                - paragraph [ref=f18e866]: Grov overtredelse av første ledd straffes med bot eller fengsel inntil 2 år eller begge deler, om ikke strengere straffebestemmelse får anvendelse. Ved avgjørelsen av om overtredelsen er grov, skal det særlig legges vekt på om den økonomiske eller potensielle økonomiske verdien av overtredelsen er stor, om overtredelsen har skjedd systematisk og over tid, om overtredelsen har skjedd som ledd i organisert virksomhet, om overtredelsen har medført eller voldt fare for en betydelig miljøskade og om miljøskade som følge av overtredelsen er uopprettelig.
                                - paragraph [ref=f18e867]: Departementet kan i forskrift gitt i medhold av denne loven fastsette at overtredelse av forskriften ikke er straffbar.
                                - table [ref=f18e868]:
                                  - rowgroup [ref=f18e869]:
                                    - row [ref=f18e870]:
                                      - cell "0" [ref=f18e871]
                                      - cell "Endret ved lover 21 juni 2013 nr. 74 (ikr. 1 juli 2013 iflg. res. 21 juni 2013 nr. 745), 19 juni 2015 nr. 65 (ikr. 1 okt 2015)." [ref=f18e872]
                                - generic [ref=f18e873]: 🔗Del paragraf
                              - generic [ref=f18e874]:
                                - heading [level=3] [ref=f18e875]:
                                  - generic [ref=f18e876]:
                                    - text: § 31 a.
                                    - emphasis [ref=f18e878]: Samordning av tilsyn og reaksjoner i saker om akvakultur
                                - paragraph [ref=f18e879]: Myndighetene etter denne lov og etter lovene som er nevnt i § 6 første ledd bokstav d skal så langt det er hensiktsmessig, samordne tilsyn og ileggelse av reaksjoner eller sanksjoner ved lovbrudd innen akvakulturnæringen.
                                - paragraph [ref=f18e880]: Departementet kan i forskrift gi nærmere bestemmelser om samordningen, herunder bestemmelser om varsling ved mulig reaksjons- eller sanksjonsileggelse.
                                - table [ref=f18e881]:
                                  - rowgroup [ref=f18e882]:
                                    - row [ref=f18e883]:
                                      - cell "0" [ref=f18e884]
                                      - cell "Tilføyd ved lov 21 juni 2013 nr. 74 (ikr. 1 juli 2013 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e885]
                                - generic [ref=f18e886]: 🔗Del paragraf
                            - generic [ref=f18e887]:
                              - heading "Kapittel VIII. Avsluttende bestemmelser" [level=2] [ref=f18e888]
                              - generic [ref=f18e889]:
                                - heading [level=3] [ref=f18e890]:
                                  - generic [ref=f18e891]:
                                    - text: § 32.
                                    - emphasis [ref=f18e893]: Ikrafttredelse
                                - paragraph [ref=f18e894]: Loven trer i kraft 1. januar 2006.
                                - generic [ref=f18e895]: 🔗Del paragraf
                              - generic [ref=f18e896]:
                                - heading [level=3] [ref=f18e897]:
                                  - generic [ref=f18e898]:
                                    - text: § 33.
                                    - emphasis [ref=f18e900]: Overgangsbestemmelser
                                - paragraph [ref=f18e901]: Enkeltvedtak og forskrifter gitt i medhold av lov 14. juni 1985 nr. 68 om oppdrett av fisk, skalldyr m.v. og lov 21. desember 2000 nr. 118 om havbeite videreføres.
                                - generic [ref=f18e902]: 🔗Del paragraf
                              - generic [ref=f18e903]:
                                - heading [level=3] [ref=f18e904]:
                                  - generic [ref=f18e905]:
                                    - text: § 33 a.
                                    - emphasis [ref=f18e907]: Søksmålsfrist
                                - paragraph [ref=f18e908]: Departementet kan i forskrift bestemme at parten må reise søksmål om gyldigheten av forvaltningsvedtak med hjemmel i denne lov eller krav om erstatning som følge av vedtaket, innen seks måneder fra det tidspunkt da melding om endelig vedtak kom fram til vedkommende part. Det kan gis oppfriskning for oversittelse av fristen etter reglene i tvisteloven §§ 16-12 til 16-14.
                                - table [ref=f18e909]:
                                  - rowgroup [ref=f18e910]:
                                    - row [ref=f18e911]:
                                      - cell "0" [ref=f18e912]
                                      - cell "Tilføyd ved lov 21 juni 2013 nr. 74 (ikr. 1 juli 2013 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e913]
                                - generic [ref=f18e914]: 🔗Del paragraf
                              - generic [ref=f18e915]:
                                - heading [level=3] [ref=f18e916]:
                                  - generic [ref=f18e917]:
                                    - text: § 34.
                                    - emphasis [ref=f18e919]: (Opphevet)
                                - table [ref=f18e920]:
                                  - rowgroup [ref=f18e921]:
                                    - row [ref=f18e922]:
                                      - cell "0" [ref=f18e923]
                                      - cell "Opphevet ved lov 21 juni 2013 nr. 74 (ikr. 1 juli 2013 iflg. res. 21 juni 2013 nr. 745)." [ref=f18e924]
                                - generic [ref=f18e925]: 🔗Del paragraf
                              - generic [ref=f18e926]:
                                - heading [level=3] [ref=f18e927]:
                                  - generic [ref=f18e928]:
                                    - text: § 35.
                                    - emphasis [ref=f18e930]: Oppheving av andre lover
                                - paragraph [ref=f18e931]: Fra den tid loven her trer i kraft, oppheves lov 14. juni 1985 nr. 68 om oppdrett av fisk, skalldyr m.v. og lov 21. desember 2000 nr. 118 om havbeite.
