                                    - row [ref=f18e362]:
                                      - cell "0" [ref=f18e363]
                                      - cell "Endret ved lover 19 juni 2009 nr. 61 (ikr. 1 juli 2009 iflg. res. 19 juni 2009 nr. 695), 9 jan 2009 nr. 4 (ikr. 1 jan 2010), 17 apr 2009 nr. 19 (ikr. 1 jan 2010 iflg. res. 4 des 2009 nr. 1456), 21 juni 2019 nr. 70 (ikr. 1 jan 2020 iflg. res. 21 juni 2019 nr. 872)." [ref=f18e364]
                                - generic [ref=f18e365]: 🔗Del paragraf
                              - generic [ref=f18e366]:
                                - heading [level=3] [ref=f18e367]:
                                  - generic [ref=f18e368]:
                                    - text: § 7.
                                    - emphasis [ref=f18e370]: Særlig om akvakulturtillatelse til laks, ørret og regnbueørret
                                - paragraph [ref=f18e371]: "For tildeling av tillatelse til produksjon av laks, ørret og regnbueørret kan departementet gi forskrift om:"
                                - table [ref=f18e372]:
                                  - rowgroup [ref=f18e373]:
