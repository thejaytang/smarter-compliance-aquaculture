<!doctype html><html><head><meta charset="utf-8"><title>System detail canvases</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#DCE4E7;font:14px Arial}nav{height:66px;background:#173042;color:white;display:flex;gap:9px;align-items:center;padding:13px 20px}button{background:#26485A;border:1px solid #6D8997;border-radius:7px;padding:10px 14px;color:white;font:14px Arial;cursor:pointer}button:hover{background:#497185}strong{margin-right:12px}#view{position:absolute;inset:66px 0 0;overflow:hidden}iframe{position:absolute;border:0;width:3920px;height:2940px;transform-origin:0 0;pointer-events:none}#zoom{margin-left:auto}</style></head><body><nav><strong>Internal system flows</strong><button onclick="load('system1')">System1</button><button onclick="load('system2a')">System2A</button><button onclick="load('system2b')">System2B</button><button onclick="fit()">Full canvas</button><button onclick="mod(0)">01</button><button onclick="mod(1)">02</button><button onclick="mod(2)">03</button><button onclick="mod(3)">04</button><button onclick="human()">Human loop</button><button onclick="metrics()">Evaluation</button><span id="zoom"></span></nav><div id="view"><iframe title="Detailed workflow" src="system1.html"></iframe></div><script>const fr=document.querySelector('iframe'),v=document.querySelector('#view');let key='system1',s=1,tx=0,ty=0;function draw(){fr.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;document.querySelector('#zoom').textContent=Math.round(s*100)+'%'}function focus(x,y,w,h){s=Math.min((v.clientWidth-40)/w,(v.clientHeight-32)/h);tx=(v.clientWidth-w*s)/2-x*s;ty=(v.clientHeight-h*s)/2-y*s;draw()}function fit(){focus(0,0,3920,2940)}function load(k){key=k;fr.src=k+'.html';fit()}function mod(i){focus([100,1490,2880,4270][i]*.7-20,455*.7,1270*.7,2160*.7)}function human(){focus(90*.7,2620*.7,5420*.7,330*.7)}function metrics(){focus(90*.7,3010*.7,5420*.7,1000*.7)}let drag;v.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,tx,ty};v.setPointerCapture(e.pointerId)};v.onpointermove=e=>{if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;draw()}};v.onpointerup=()=>drag=null;v.onwheel=e=>{e.preventDefault();const k=Math.exp(-e.deltaY*.0015),r=v.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;tx=x-(x-tx)*k;ty=y-(y-ty)*k;s*=k;draw()};window.onresize=fit;fit();</script></body></html>
