<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material library · isolated fixture</title>
<link rel="stylesheet" href="/workbench/frontend/assets/style.css"><link rel="stylesheet" href="/workbench/frontend/assets/materials.css"><link rel="stylesheet" href="/workbench/frontend/assets/requirements.css"><link rel="stylesheet" href="/workbench/frontend/assets/markdown-content.css"><link rel="stylesheet" href="/workbench/frontend/assets/collaboration.css"><link rel="stylesheet" href="/workbench/frontend/assets/four-pane.css">
<style>body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;margin:0}.fixture-tools{flex:none;padding:12px 16px;background:var(--surface-subtle);border-bottom:1px solid var(--line);font:13px/1.4 sans-serif}.fixture-tools h1{font-size:17px;margin:0 0 6px}.fixture-tools p{margin:5px 0}.fixture-tools label{display:inline-flex;gap:6px;margin-inline-end:12px;align-items:center}.fixture-tools input[type=checkbox]{width:auto;margin:0}.fixture-tools select{width:auto}.fixture-tools pre{max-height:100px;overflow:auto;white-space:pre-wrap}#fixture-view{flex:1;min-height:0;overflow:hidden}</style></head>
<body><section class="fixture-tools"><h1>Material library · isolated fixture</h1><p>124 synthetic materials. Page-local API only; no business API proxy. Saves and source opens are logged below. Do not treat synthetic content as reviewed law.</p><label>Reviewer<select id="fixture-reviewer"><option value="fixture-a">Fixture A</option><option value="fixture-b">Fixture B</option></select></label><label><input id="fixture-archive" type="checkbox">Archive</label><button id="fixture-remount" type="button">Leave and return to Materials</button><details><summary>Local API log</summary><pre id="fixture-log"></pre></details></section><main id="fixture-view"></main>
<script type="module">
import {Materials} from '/workbench/frontend/components/materials.js';
const q=s=>document.querySelector(s),copy=x=>structuredClone(x),events=[];
const materials=Array.from({length:124},(_,i)=>{const id='material-'+(i+1),sid='FX'+String(i+1).padStart(3,'0'),status=['running','partial','ready','failed'][i];return {id,title:(i===60?'海水温度 · ':'Synthetic material · ')+String(i+1).padStart(3,'0'),source:{source_id:sid,snapshot_id:'snapshot-'+sid,version:'Fixture v1'},revision:3,content_revision:1,blocks:[{id:'block-'+id,type:'text',text:'Synthetic content for UI navigation only.',source_refs:[]}],block_count:1,scope:[],checked_scope:[],issues:[],content_status:'draft',candidates:status?[{id:'candidate-'+id,status,block_count:3}]:[],queue:{task_type:i===4?'inspection':'review',archive_revision:3,open_inspections:i===4?[{id:'check-v2',assignee:'Fixture reviewer',status:'pending',archive_revision:2,at:'2026-09-20T10:00:00Z'},{id:'check-v3',assignee:'Fixture reviewer',status:'pending',archive_revision:3,at:'2026-09-22T10:00:00Z'}]:[]}};});
const sources=[{source_id:'FX001',source_title:'Same title · 中文 <fixture>',version:'v1'},{source_id:'FX002',source_title:'Same title · 中文 <fixture>',version:'v2'}];
const api=async(path,body)=>{events.push({path,...(body?{body:copy(body)}:{})});q('#fixture-log').textContent=JSON.stringify(events,null,2);const url=new URL(path,location.origin),p=url.searchParams;
 if(url.pathname==='/api/material-queue'){const history=p.get('bucket')==='archive';let rows=materials.filter(m=>(!p.get('query')||[m.title,m.source.source_id].join(' ').toLowerCase().includes(p.get('query').toLowerCase()))&&(!p.get('task_type')||m.queue.task_type===p.get('task_type')));if(history)rows=rows.map(m=>({...m,content_status:'content_review_complete',candidates:[],confirmation:{actor:'Fixture reviewer',at:'2026-09-22T10:00:00Z'}}));const offset=Number(p.get('offset')||0),limit=50;return copy({materials:rows.slice(offset,offset+limit),sources,total:rows.length,offset,limit,has_more:offset+limit<rows.length});}
 if(url.pathname==='/api/collaboration/state')return {mode:'coordinator',peer_sync:true,coordinator:'Fixture A',read_only:false};
 if(url.pathname==='/api/material/open'){const material=materials.find(m=>m.source.source_id===body.source_id);if(!material)throw Error('Unknown synthetic source');return copy(material);}
 if(url.pathname==='/api/material'){const material=materials.find(m=>m.id===p.get('id'));if(!material)throw Error('Unknown synthetic material');return copy({...material,candidates:[],collaboration:{view:p.get('view')==='archive'?'archive':'personal',inspections:[]},...(p.get('view')==='archive'?{content_status:'content_review_complete',confirmation:{actor:'Fixture reviewer',at:'2026-09-22T10:00:00Z'}}:{})});}
 if(url.pathname==='/api/requirements')return {sessions:[]};
 if(url.pathname==='/api/material/reader')return {kind:'unsupported',warnings:['This synthetic material has no original file.']};
 if(url.pathname==='/api/material-inspection'){throw Error('Synthetic check '+p.get('task_id')+' was selected. Its exact ID is logged; no business task was opened.');}
 throw Error('Fixture does not implement '+url.pathname+'. No network API request was made.');
};
const view=new Materials();async function mount(){view.leave();const id=q('#fixture-reviewer').value;await view.mount(q('#fixture-view'),{api,state:{actor:{id,name:id==='fixture-a'?'Fixture A':'Fixture B'},collaboration:{peer_sync:true}},history:q('#fixture-archive').checked});}
q('#fixture-remount').onclick=mount;q('#fixture-reviewer').onchange=mount;q('#fixture-archive').onchange=mount;await mount();
</script></body></html>
