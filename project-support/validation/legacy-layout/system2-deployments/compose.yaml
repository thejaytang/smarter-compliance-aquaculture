services:
  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../runtime:/app/runtime
      - ../outputs:/data/outputs
      - ../.cache/paddlex:/models/paddlex
      - ../.cache/huggingface:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    command: ["pdf-extract-worker", "--database", "/app/runtime/jobs.sqlite3"]
    volumes:
      - ../runtime:/app/runtime
      - ../outputs:/data/outputs
      - ../.cache/paddlex:/models/paddlex
      - ../.cache/huggingface:/models/huggingface
    restart: unless-stopped
