name: Workbench portability
on:
  workflow_dispatch:
  push:
    branches: ['main', 'codex/workbench-optimization-*']
permissions:
  contents: read
jobs:
  colleague-handoff:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install environment manager
        run: python -m pip install uv
      - name: Rebuild through the Windows entry point
        if: runner.os == 'Windows'
        shell: cmd
        run: call "workbench\deployment\Rebuild environments.cmd"
      - name: Rebuild through the shared environment implementation
        if: runner.os != 'Windows'
        run: python workbench/deployment/rebuild_environments.py
      - name: Real launch, Collaboration return and application update
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then component_python=workbench/.venv/Scripts/python.exe; else component_python=workbench/.venv/bin/python; fi
          "$component_python" workbench/tests/integration/colleague_handoff.py
  workbench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: workbench/src
    steps:
      - name: Support retained long evidence paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep business data outside application updates
        run: python workbench/deployment/check_app_boundary.py
      - name: Install platform timezone data
        run: python -m pip install tzdata==2026.3
      - name: Recreate System2 environment for the reviewer HTTP bridge
        shell: bash
        run: |
          python -m pip install uv
          cd system2
          uv sync --locked --python 3.12 --extra dev
      - name: Backend and HTTP tests
        run: python -m unittest discover -s workbench/tests -v
      - name: Frontend state and rendering tests
        shell: bash
        run: node --test workbench/tests/*.mjs
      - name: Syntax and launcher portability
        run: python -m compileall -q workbench/src
  material-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Support retained long evidence paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Recreate locked System2 test environment
        working-directory: system2
        run: uv sync --locked --python 3.12 --extra dev
      - name: Verify materials, provenance, Markdown and platform behavior
        working-directory: system2
        run: uv run --locked --extra dev python -m pytest tests/test_materials.py tests/test_material_body.py tests/test_material_markdown.py tests/test_material_reader_navigation.py tests/test_api_environment.py tests/test_platform_memory.py tests/test_sqlite_lifecycle.py tests/integration/test_platform_support.py -q

  source-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Support retained long evidence paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source workflow in its own environment
        shell: bash
        working-directory: system1/Code
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then component_python=.venv/Scripts/python.exe; else component_python=.venv/bin/python; fi
          "$component_python" -m pip install -r deployment/requirements.txt
          PYTHONPATH=src "$component_python" -m unittest discover -s tests -v
