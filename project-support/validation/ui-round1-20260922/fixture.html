<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Source UI round 1 · isolated fixture</title>
<link rel="stylesheet" href="/workbench/frontend/assets/style.css">
<link rel="stylesheet" href="/workbench/frontend/assets/collaboration.css">
<link rel="stylesheet" href="/workbench/frontend/assets/source-workspace.css">
<style>
body{margin:0;display:flex;flex-direction:column;height:100dvh;overflow:hidden;background:var(--surface,#fff)}
.fixture-controls{padding:12px 16px;border-bottom:1px solid var(--line,#cad4df);font:13px/1.5 sans-serif;flex:none;background:var(--surface-subtle,#f3f6fa)}
.fixture-controls h1{font-size:17px;margin:0 0 4px}.fixture-controls p{margin:4px 0 8px}.fixture-controls fieldset{display:flex;flex-wrap:wrap;gap:8px 18px;border:0;padding:0;margin:6px 0}.fixture-controls label{display:inline-flex;gap:5px;align-items:center}.fixture-controls input[type=checkbox]{width:16px;margin:0}.fixture-controls input[type=number]{width:80px;margin:0}
.fixture-controls details{margin:4px 0}.fixture-controls pre{max-height:100px;overflow:auto;white-space:pre-wrap;font-size:11px}#fixture-view{min-height:0;flex:1;overflow:hidden}
</style>
</head>
<body>
<section class="fixture-controls" aria-label="Isolated test controls">
<h1>Source UI round 1 · isolated fixture</h1>
<p>Two synthetic sources. The API below runs only in this page. No request can reach the business API, and saves only add to the local event log.</p>
<fieldset><label><input id="editable" type="checkbox">Allow local draft editing</label><label><input id="empty" type="checkbox">Empty review queue</label><button id="reload-fixture" type="button">Reload fixture view</button></fieldset>
<fieldset><label><input id="fail-list" type="checkbox">Fail next list read</label><label><input id="slow-list" type="checkbox">Delay next list read</label><label><input id="fail-detail" type="checkbox">Fail next detail read</label><label><input id="slow-detail" type="checkbox">Delay next detail read</label><label>Delay (ms)<input id="delay" type="number" value="1500" min="0" max="10000" step="500"></label></fieldset>
<details><summary>Local API event log · <span id="write-count">0</span> writes</summary><pre id="fixture-log"></pre></details>
</section>
<main id="fixture-view" aria-label="Synthetic source workspace"></main>
<script type="module">
import {SourceWorkspace} from '/workbench/frontend/components/source-workspace.js';
const q=s=>document.querySelector(s),copy=x=>structuredClone(x),events=[];
const sources=[
 {source_id:'FX001',source_title:'Synthetic source · Inspection and original-document review',source_revision:'fixture-source-1',issuer:'Fixture publisher',version:'Fixture v1',snapshot_status:'MISSING',effective_selection:'PENDING',authority_quality:'HIGH',scope_relevance:'MEDIUM',version_currency:'LOW',traceability:'HIGH',access_permission:'MEDIUM'},
 {source_id:'FX002',source_title:'Synthetic source · Lang norsk tittel for kontroll av lesbarhet i arbeidsområdet ved gjennomgang av dokumenter, oppfølging av registrerte forhold og vurdering av informasjon fra flere kilder',source_revision:'fixture-source-2',issuer:'Fixture publisher',version:'Fixture v2',snapshot_status:'MISSING',effective_selection:'PENDING',authority_quality:'HIGH',scope_relevance:'HIGH',version_currency:'MEDIUM',traceability:'HIGH',access_permission:'HIGH'}
];
const tasks=sources.map((s,i)=>({source_id:s.source_id,source_title:s.source_title,operation_id:'fixture-task-'+i,revision:1,operation_type:'SOURCE_REVIEW',trigger:i?'VERSION':'FILE',is_open:true,created_at:'2026-09-22T10:00:00Z'}));
const scoreFields=['authority_quality','scope_relevance','version_currency','traceability','access_permission'];
const fields=[{key:'source_title',label:'Source title'},{key:'issuer',label:'Publisher'}];
const reviews=new Map(sources.map(s=>[s.source_id,{revision:1,review:{fields:{source_title:s.source_title,issuer:s.issuer},scores:Object.fromEntries(scoreFields.map(k=>[k,s[k]])),selection:'PENDING',note:'',issue_checks:{},task_checks:{},new_issues:[]}}]));
function log(path,body){events.push({path,method:body?'LOCAL WRITE':'LOCAL READ',...(body?{body:copy(body)}:{})});q('#write-count').textContent=String(events.filter(e=>e.method==='LOCAL WRITE').length);q('#fixture-log').textContent=JSON.stringify(events,null,2);}
async function fault(kind){const fail=q('#fail-'+kind).checked,slow=q('#slow-'+kind).checked;q('#fail-'+kind).checked=false;q('#slow-'+kind).checked=false;if(slow)await new Promise(resolve=>setTimeout(resolve,Math.max(0,Math.min(10000,Number(q('#delay').value)||0))));if(fail)throw Error('Synthetic '+kind+' read failure. Retry is safe.');}
const api=async(path,body)=>{
 log(path,body);
 const url=new URL(path,location.origin);
 if(!body&&url.pathname==='/api/source-workspace'){await fault('list');return copy({sources,tasks:q('#empty').checked?[]:tasks,history:[{source_id:'FX001',source_title:sources[0].source_title,operation_id:'fixture-history-1',action:'fixture inspection',operator:'Fixture reviewer',at:'2026-09-22T10:00:00Z',note:'Synthetic history only.'}],personal_tasks:[],can_apply:true,task_actions:{SOURCE_REVIEW:[]}});}
 if(!body&&url.pathname==='/api/source-workspace/detail'){await fault('detail');const sid=url.searchParams.get('source_id'),source=sources.find(s=>s.source_id===sid),saved=reviews.get(sid);if(!source)throw Error('Unknown synthetic source.');return copy({source,fields,score_fields:scoreFields,issues:[],draft_revision:saved.revision,source_review:saved.review});}
 if(body&&url.pathname==='/api/source-workspace/preview')return {effective_selection:body.source_review.selection,remaining_reason:'Fixture preview. No real review will be applied.'};
 if(body&&url.pathname==='/api/source-workspace/save'){const saved=reviews.get(body.source_id);saved.review=copy(body.source_review);saved.revision++;return {draft_revision:saved.revision};}
 if(body&&url.pathname==='/api/source-workspace/apply')return {source_status:'FIXTURE ONLY',source_receipt:{effective_selection:'FIXTURE ONLY',unresolved_reasons:[]}};
 throw Error('This isolated fixture does not implement '+url.pathname+'. No network request was sent.');
};
const view=new SourceWorkspace(),state={actor:{id:'fixture-reviewer',name:'Fixture reviewer'},collaboration:{mode:'coordinator'}};
async function mount(){view.leave();await view.mount(q('#fixture-view'),{api,state,category:q('#editable').checked?'pending':'records'});}
q('#editable').onchange=mount;q('#empty').onchange=()=>view.refresh();q('#reload-fixture').onclick=mount;
await mount();
</script>
</body>
</html>
