name: Workbench portability
on:
  workflow_dispatch:
  push:
    branches: ['codex/workbench-optimization-*']
    paths:
      - 'workbench/**'
      - 'system2/src/**'
      - 'system2/tests/**'
      - '.github/workflows/workbench-portability.yml'
permissions:
  contents: read
jobs:
  workbench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: workbench/src
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install platform timezone data
        run: python -m pip install tzdata==2026.3
      - name: Backend and HTTP tests
        run: python -m unittest discover -s workbench/tests -v
      - name: Frontend state and rendering tests
        shell: bash
        run: node --test workbench/tests/*.mjs
      - name: Syntax and launcher portability
        run: python -m compileall -q workbench/src
  material-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Recreate locked System2 test environment
        working-directory: system2
        run: uv sync --locked --python 3.12 --extra dev
      - name: Verify materials, provenance, Markdown and platform behavior
        working-directory: system2
        run: uv run --locked --extra dev python -m pytest tests/test_materials.py tests/test_material_body.py tests/test_material_markdown.py tests/test_material_reader_navigation.py tests/test_api_environment.py -q
